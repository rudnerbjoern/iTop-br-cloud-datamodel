<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="780" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Cloud inventory context</title>
  <desc id="desc">The collector reads IONOS inventory and sends it to iTop. CMDB operators maintain records in iTop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker>
  </defs>
  <rect width="780" height="180" fill="white"/>
  <g fill="#eef3f7" stroke="#465868" stroke-width="1.5">
    <rect x="12" y="78" width="148" height="48" rx="5"/>
    <rect x="264" y="78" width="145" height="48" rx="5"/>
    <rect x="600" y="78" width="160" height="48" rx="5"/>
    <rect x="600" y="5" width="160" height="34" rx="5"/>
  </g>
  <g fill="#172b3a" font-family="sans-serif" font-size="15" text-anchor="middle">
    <text x="86" y="108">IONOS Cloud API</text><text x="336" y="108">IONOS collector</text>
    <text x="680" y="108">iTop CMDB</text><text x="680" y="28">CMDB operator</text>
    <g font-size="13"><text x="210" y="92">Inventory</text><text x="504" y="72">Cloud and LAN sources</text><text x="504" y="144">Network inventory via REST</text><text x="602" y="59">Edits records</text></g>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 102H261"/><path d="M409 90H597"/><path d="M409 115H597"/><path d="M680 39V75"/>
  </g>
</svg>
